name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 12 * * *"   # todos los días a las 12:00 UTC
  workflow_dispatch:        # permite ejecutarlo a mano para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la función ping de la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
